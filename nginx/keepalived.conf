# ====================================================================
# STOCKAI PRO - Keepalived VRRP Configuration for Nginx HA
# Enforces sub-second Virtual IP failovers across load-balancer nodes.
# ====================================================================

vrrp_script chk_nginx {
    script "killall -0 nginx"
    interval 2
    weight 2
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 101
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass PipariyaHASecret
    }

    virtual_ipaddress {
        192.168.1.200/24
    }

    track_script {
        chk_nginx
    }
}
