name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      APP_ENV: development
      ENV: development
      DATABASE_URL: sqlite+aiosqlite:///./stockai_ci.db
      REQUIRE_POSTGRES: "false"
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_only_jwt_secret_stockai_pro_replace_before_prod_0123456789
      SMARTAPI_API_KEY: ci
      SMARTAPI_CLIENT_ID: ci
      SMARTAPI_CLIENT_PWD: ci
      SMARTAPI_TOTP_SECRET: ci
      NEWS_API_KEY: ci
      MIN_BACKEND_COVERAGE: "70"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip check

      - name: Backend dependency audit (report only)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Validate env templates
        run: python scripts/validate_env.py --project-root .

      - name: Run black (check mode)
        working-directory: backend
        run: black --check app tests

      - name: Run flake8
        working-directory: backend
        run: flake8 app tests

      - name: Run pytest with coverage
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail

          COVERAGE_TARGET="${MIN_BACKEND_COVERAGE:-0}"
          if echo "$COVERAGE_TARGET" | grep -Eq '^[0-9]+$' && [ "$COVERAGE_TARGET" -gt 0 ]; then
            echo "Enforcing minimum backend coverage: ${COVERAGE_TARGET}%"
            pytest tests --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under="$COVERAGE_TARGET"
          else
            echo "No minimum backend coverage configured. Set repository variable MIN_BACKEND_COVERAGE to enforce one."
            pytest tests --cov=app --cov-report=term-missing --cov-report=xml
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend dependency audit (production deps)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.stockai-pro.in
          VITE_WS_URL: wss://api.stockai-pro.in/live
        run: npm run build

  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend, frontend]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
