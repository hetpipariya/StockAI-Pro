# ====================================================================
# STOCKAI PRO - Nginx Configuration
# Production-ready reverse proxy with security headers and optimization
# ====================================================================

# Upstream backends (docker service names - resolved by Docker DNS)
#upstream frontend_backend {
  #  server frontend:80;
   # keepalive 32;
#}

upstream api_backend {
    hash $http_authorization consistent;
    server api-backend-1:8000;
    server api-backend-2:8000;
    server api-backend-3:8000;
    keepalive 32;
}

upstream ws_gateway {
    server ws-1:8001;
    server ws-2:8001;
    server ws-3:8001;
    keepalive 32;
}

# ========== HTTP Server (Port 80) ==========
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ========== Performance ==========
    types_hash_max_size 2048;
    client_max_body_size 10M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    keepalive_timeout 65s;

    # ========== Logging ==========
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # ========== GZIP Compression ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript \
               application/json application/javascript application/xml+rss \
               application/rss+xml application/atom+xml image/svg+xml \
               text/x-component text/x-cross-domain-policy;
    gzip_min_length 1000;

    # ========== SSL (Optional - configure with certbot) ==========
    # For production HTTPS:
    # 1. Generate certificate: certbot certonly --standalone -d yourdomain.com
    # 2. Uncomment SSL configuration below
    # 3. Set up auto-renewal: certbot renew --dry-run
    # 
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    # ========== Security Headers ==========
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=()" always;

    # ========== Health Check Endpoint ==========
    location /health {
        access_log off;
        proxy_pass http://api_backend/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========== Frontend Static Files ==========
    location / {

        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        #proxy_pass http://frontend_backend;
        #proxy_http_version 1.1;
        #proxy_set_header Host $host;
        #proxy_set_header X-Forwarded-Host $host;
        #proxy_set_header X-Real-IP $remote_addr;
        #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #proxy_set_header X-Forwarded-Proto $scheme;
        #proxy_cache_bypass $http_upgrade;

        #proxy_redirect off;
        # SPA fallback to index.html
        
        
    }

    # ========== Auth Endpoints (Rate Limited) ==========
    location /api/v1/auth/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== Token Endpoint ==========
    location /token {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========== Backend API Requests (Rate Limited) ==========
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== WebSocket: ws ==========
    location /ws {
        proxy_pass http://ws_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ========== WebSocket: Live Feed ==========
    location /live {
        proxy_pass http://ws_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ========== WebSocket: Market Data ==========
    location /ws/market {
        proxy_pass http://ws_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ========== Metrics (Restricted Access) ==========
    location /metrics {
        # Only allow from Docker internal network
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    # ========== Deny Access to Sensitive Files ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ========== Rate Limiting Zones ==========
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;



