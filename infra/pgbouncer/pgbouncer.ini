# ====================================================================
# STOCKAI PRO - PGBOUNCER CONFIGURATION
# High-concurrency transaction pooling for 1000+ concurrent active sockets
# ====================================================================

[databases]
# Format: dbname = host=... port=... user=... password=... auth_user=...
stockai = host=db port=5432 dbname=stockai
trading_db = host=db port=5432 dbname=stockai
quant_engine = host=db port=5432 dbname=stockai

[pgbouncer]
# Administrative settings
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

# Network settings
listen_addr = *
listen_port = 6432

# Authentication settings
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Pool configuration
# 'transaction' mode is essential for massive scaling with SQLAlchemy
pool_mode = transaction

# Connection limits
max_client_conn = 5000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 150

# Timeouts & Keepalives
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
client_login_timeout = 60

# Keepalive settings
autodb_idle_timeout = 3600
pkt_buf = 4096
listen_backlog = 128
