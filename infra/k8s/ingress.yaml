apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockai-ingress
  namespace: stockai
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "websocket-gateway"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "balanced"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
spec:
  rules:
    - host: api.stockai-pro.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: websocket-gateway
                port:
                  number: 8001
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: websocket-gateway
                port:
                  number: 8001
          - path: /ws/market
            pathType: Prefix
            backend:
              service:
                name: websocket-gateway
                port:
                  number: 8001
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: api-backend
                port:
                  number: 8000
          - path: /token
            pathType: Prefix
            backend:
              service:
                name: api-backend
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-backend
                port:
                  number: 8000
