apiVersion: v1
kind: Service
metadata:
  name: api-backend
  namespace: stockai
  labels:
    app: api-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: api-backend
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-gateway
  namespace: stockai
  labels:
    app: websocket-gateway
spec:
  type: ClusterIP
  ports:
    - name: websocket
      port: 8001
      targetPort: 8001
  selector:
    app: websocket-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: stockai
  labels:
    app: ai-engine
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8003
      targetPort: 8003
  selector:
    app: ai-engine
---
apiVersion: v1
kind: Service
metadata:
  name: market-feed
  namespace: stockai
  labels:
    app: market-feed
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  selector:
    app: market-feed
