version: '3.9'

# ====================================================================
# STOCKAI PRO - Docker Compose Configuration
# Production-ready stack with all optimization
# ====================================================================

services:
  # ========== DATABASE ==========
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: stockai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockai}
      #POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:--c max_connections=100}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stockai
    command: postgres -c max_connections=250 -c shared_buffers=256MB

  # ========== DATABASE POOLER (PgBouncer) ==========
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: stockai_pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stockai

  # ========== CACHE (Redis) ==========
  redis:
    image: redis:7-alpine
    container_name: stockai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - stockai
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru

  # ========== BACKEND (FastAPI) ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Best practices for Docker build caching
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: stockai_backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-stockai}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # SmartAPI Broker
      SMARTAPI_API_KEY: ${SMARTAPI_API_KEY:-}
      SMARTAPI_CLIENT_ID: ${SMARTAPI_CLIENT_ID:-}
      SMARTAPI_CLIENT_PWD: ${SMARTAPI_CLIENT_PWD:-}
      SMARTAPI_TOTP_SECRET: ${SMARTAPI_TOTP_SECRET:-}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # API Keys
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      # Application
      APP_ENV: ${APP_ENV:-production}
      PORT: 8000
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - stockai
    volumes:
      - ./backend/models:/app/models:ro  # Read-only model access

  # ========== FRONTEND (React + Vite + Nginx) ==========
  #frontend:
   # build:
    #  context: ./frontend
     # dockerfile: Dockerfile
    #container_name: stockai_frontend
    #restart: unless-stopped
    #depends_on:
     # - backend
    #networks:
     # - stockai
    #expose:
     # - "80"
    #environment:
     # - NODE_ENV=production

  # ========== REVERSE PROXY (Nginx) ==========
  nginx:
    image: nginx:1.25-alpine
    container_name: stockai_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html
      # Optionally mount SSL certificates if using HTTPS
      # - /path/to/ssl/cert:/etc/nginx/ssl/cert.pem:ro
      # - /path/to/ssl/key:/etc/nginx/ssl/key.pem:ro
    depends_on:
      
      - backend
    networks:
      - stockai
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========== MONITORING (Prometheus) ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: stockai_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - stockai
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

  # ========== VISUALIZATION (Grafana) ==========
  grafana:
    image: grafana/grafana:latest
    container_name: stockai_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - stockai

# ========== NETWORKS ==========
networks:
  stockai:
    driver: bridge

# ========== VOLUMES ==========
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  promdata:
    driver: local
  grafanadata:
    driver: local

