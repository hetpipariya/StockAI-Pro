apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-feed
  namespace: stockai
  labels:
    app: market-feed
spec:
  replicas: 2  # Active-Passive Setup
  strategy:
    type: Recreate  # Avoid duplicate broker connections during deployment rollouts
  selector:
    matchLabels:
      app: market-feed
  template:
    metadata:
      labels:
        app: market-feed
    spec:
      containers:
        - name: market-feed
          image: stockai/market-feed:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stockai-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
